name: Process Operational Area Submission
run-name: Process operational area issue #${{ github.event.issue.number }}

on:
  issues:
    # `edited` lets an operator who opened the issue before pasting the
    # submission text (large-area copy/paste path) fix it in place.
    types: [opened, reopened, edited]

# Serialize runs for the same issue so rapid edits cannot race each other.
concurrency:
  group: operational-area-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-submission:
    # The Operational Area Issue Template is the single entry point.
    # The dispatcher decides whether the payload is Polygon, Circle, or MultiCircle.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '<!-- OPERATIONAL-AREA-SUBMISSION -->')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MultiCircle geometry dependency
        run: pip install shapely

      - name: Process operational-area submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/process_submission.py
