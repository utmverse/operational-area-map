name: Build and Publish Operational Area Map

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "submit.html"
      - "operational-areas/**/*.geojson"
      - "scripts/build_map_data.py"
      - "scripts/check_overlap.py"
      - "scripts/test_overlap_semantics.py"
      - "scripts/prepare_submission_page.py"
      - "scripts/fix_circle_input_state.py"
      - "scripts/fix_github_submission_preview.py"
      - "scripts/fix_multicircle_popup_behavior.py"
      - "scripts/fix_multicircle_visual_rendering.py"
      - "scripts/fix_geometry_overlap_ui.py"
      - "scripts/simplify_operational_area_popup.py"
      - "scripts/address_lookup_test.mjs"
      - ".github/workflows/build-map.yml"
  repository_dispatch:
    types: [operational-area-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install shapely

      - name: Test overlap semantics
        run: python scripts/test_overlap_semantics.py

      - name: Build shared GeoJSON
        run: python scripts/build_map_data.py --output map/operational-areas.geojson

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp submit.html _site/submit.html
          python scripts/prepare_submission_page.py _site/submit.html
          python scripts/fix_circle_input_state.py _site/submit.html
          python scripts/fix_github_submission_preview.py _site/submit.html
          python scripts/fix_multicircle_popup_behavior.py _site/index.html
          python scripts/fix_multicircle_visual_rendering.py _site/index.html
          python scripts/fix_geometry_overlap_ui.py _site/index.html
          python scripts/simplify_operational_area_popup.py _site/index.html
          cp map/operational-areas.geojson _site/operational-areas.geojson

      - name: Test address lookup
        run: node scripts/address_lookup_test.mjs _site/index.html

      - name: Validate submission page
        run: |
          test -s _site/submit.html
          if grep -Fq "/issues/new?template=" _site/submit.html; then
            echo "ERROR: submission page still uses the GitHub template URL path"
            exit 1
          fi
          grep -Fq "/issues/new?title=" _site/submit.html
          grep -Fq "<!-- OAM2:" _site/submit.html
          echo "Submission page validation passed."

      - name: Validate map page
        run: |
          test -s _site/index.html
          grep -Fq "geometry-overlap-ui-fix: 2026-09-21" _site/index.html
          grep -Fq "multicircle-visual-rendering-fix: 2026-09-21" _site/index.html
          grep -Fq "simplified-operational-area-popup: 2026-09-21" _site/index.html
          grep -Fq "<strong>Locality:</strong>" _site/index.html
          grep -Fq "<strong>Center:</strong>" _site/index.html
          grep -Fq "Address" _site/index.html
          grep -Fq "Coordination contact:" _site/index.html
          if grep -Fq "Operational-area status:" _site/index.html; then
            echo "ERROR: redundant operational-area status remains in popup"
            exit 1
          fi
          if grep -Fq "Actual overlap:" _site/index.html; then
            echo "ERROR: overlap details remain in popup"
            exit 1
          fi
          if grep -Fq "Definition:</strong>" _site/index.html; then
            echo "ERROR: definition details remain in popup"
            exit 1
          fi
          if grep -Fq "Effective:</strong>" _site/index.html; then
            echo "ERROR: effective-date details remain in popup"
            exit 1
          fi
          grep -Fq "reverse-geocode:v3" _site/index.html
          grep -Fq "data-address-lat" _site/index.html
          if grep -Fq "getElementById(addressId)" _site/index.html; then
            echo "ERROR: a superseded address-lookup handler survived the patch chain"
            exit 1
          fi
          popup_hooks=$(grep -c "on('popupopen'" _site/index.html || true)
          if [ "$popup_hooks" != "1" ]; then
            echo "ERROR: expected exactly one popupopen handler, found $popup_hooks"
            exit 1
          fi
          # The count above only proves no duplicate handler crept back in; these
          # prove the single handler is actually wired to both popup paths.
          grep -Fq "bindPopupAddressLookup(layer)" _site/index.html
          grep -Fq "bindPopupAddressLookup(circleLayer)" _site/index.html
          echo "Map page validation passed."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
